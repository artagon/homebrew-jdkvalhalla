name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-static:
    name: Static validation
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b2a302b9a642580cae998e6ba2076ffd28e61317 # v5

      - name: Install validation tools
        run: brew install actionlint bats-core shellcheck

      - name: Validate Ruby package syntax
        run: |
          set -Eeuo pipefail
          for package in Casks/*.rb Formula/*.rb; do
            ruby -c "${package}"
          done

      - name: Run Homebrew style and audit
        run: |
          set -Eeuo pipefail
          brew style Casks/*.rb Formula/*.rb
          for formula in Formula/*.rb; do
            token="$(basename "${formula}" .rb)"
            brew audit --formula "artagon/jdkvalhalla/${token}"
          done
          for cask in Casks/*.rb; do
            token="$(basename "${cask}" .rb)"
            brew audit --cask "artagon/jdkvalhalla/${token}"
          done

      - name: Run package contracts
        run: bats tests/formula_contract.bats tests/documentation_contract.bats

      - name: Run Ruby unit tests
        run: |
          set -Eeuo pipefail
          ruby tests/bottle_artifact_validator_test.rb
          ruby tests/parse_valhalla_release_test.rb
          ruby tests/workflow_security_test.rb

      - name: Lint workflows and shell
        run: |
          set -Eeuo pipefail
          actionlint .github/workflows/*.yml
          shellcheck scripts/test.sh tests/*.bats

  test-cask-macos:
    name: Prebuilt cask (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b2a302b9a642580cae998e6ba2076ffd28e61317 # v5

      - name: Install prebuilt cask
        run: brew install --cask artagon/jdkvalhalla/jdkvalhalla

      - name: Verify prebuilt cask
        run: /Library/Java/JavaVirtualMachines/jdk-valhalla.jdk/Contents/Home/bin/java -version

      - name: Uninstall prebuilt cask
        if: ${{ always() }}
        run: brew uninstall --cask artagon/jdkvalhalla/jdkvalhalla || true

  test-prebuilt-formula:
    name: Prebuilt formula (${{ matrix.formula }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        formula: [jdkvalhalla@26, jdkvalhalla@27]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b2a302b9a642580cae998e6ba2076ffd28e61317 # v5

      - name: Install prebuilt formula
        run: brew install "artagon/jdkvalhalla/${{ matrix.formula }}"

      - name: Verify Java runtime and compiler
        env:
          FORMULA: ${{ matrix.formula }}
        run: |
          set -Eeuo pipefail
          prefix="$(brew --prefix "${FORMULA}")"
          "${prefix}/bin/java" -version
          printf '%s\n' \
            'public class HelloWorld {' \
            '  public static void main(String[] args) {' \
            '    System.out.println("Valhalla works");' \
            '  }' \
            '}' > HelloWorld.java
          "${prefix}/bin/javac" HelloWorld.java
          "${prefix}/bin/java" HelloWorld

      - name: Uninstall prebuilt formula
        if: ${{ always() }}
        run: brew uninstall --formula "${{ matrix.formula }}" || true

  validation-status:
    name: Validation Status
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - validate-static
      - test-cask-macos
      - test-prebuilt-formula
    steps:
      - name: Confirm completion
        env:
          VALIDATE_STATIC_RESULT: ${{ needs.validate-static.result }}
          TEST_CASK_MACOS_RESULT: ${{ needs.test-cask-macos.result }}
          TEST_PREBUILT_FORMULA_RESULT: ${{ needs.test-prebuilt-formula.result }}
        run: |
          set -Eeuo pipefail
          for result in \
            "${VALIDATE_STATIC_RESULT}" \
            "${TEST_CASK_MACOS_RESULT}" \
            "${TEST_PREBUILT_FORMULA_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              printf 'Required validation job result: %s\n' "${result}" >&2
              exit 1
            fi
          done
