name: Audit

on:
  schedule:
    - cron: '0 12 * * 1'  # Weekly on Mondays at noon UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b2a302b9a642580cae998e6ba2076ffd28e61317 # v5

      - name: Validate formula syntax
        run: |
          for f in Formula/*.rb; do
            echo "==> Checking $f"
            brew style "$f"
            ruby -c "$f"
          done

      - name: Validate cask syntax
        run: |
          for f in Casks/*.rb; do
            echo "==> Checking $f"
            brew style "$f"
            ruby -c "$f"
          done

      - name: Audit formulas
        run: |
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            echo "==> Auditing formula artagon/jdkvalhalla/$name"
            brew audit --formula "artagon/jdkvalhalla/$name"
          done

      - name: Audit casks
        run: |
          for f in Casks/*.rb; do
            name="$(basename "$f" .rb)"
            echo "==> Auditing cask artagon/jdkvalhalla/$name"
            brew audit --cask "artagon/jdkvalhalla/$name"
          done
