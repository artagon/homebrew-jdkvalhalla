name: Update Valhalla EA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 0'

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      full_version: ${{ steps.release.outputs.full_version }}
      jdk_version: ${{ steps.release.outputs.jdk_version }}
      ea_tag: ${{ steps.release.outputs.ea_tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Parse official Valhalla release
        id: release
        run: |
          set -Eeuo pipefail
          page_file="$(mktemp)"
          trap 'rm -f -- "${page_file}"' EXIT
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --retry 3 \
            'https://jdk.java.net/valhalla/' \
            --output "${page_file}"
          ruby scripts/parse-valhalla-release.rb "${page_file}" "${GITHUB_OUTPUT}"

      - name: Cache JDK downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/jdk-cache
          key: valhalla-${{ steps.release.outputs.full_version }}

      - name: Download and verify official archives
        id: archives
        env:
          BUILD: ${{ steps.release.outputs.build }}
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
          JDK_VERSION: ${{ steps.release.outputs.jdk_version }}
        run: |
          set -Eeuo pipefail
          cache_dir="/tmp/jdk-cache"
          mkdir -p "${cache_dir}"
          base="https://download.java.net/java/early_access/valhalla/${JDK_VERSION}/${BUILD}"

          validate_url() {
            ruby -ruri -e '
              uri = URI.parse(ARGV.fetch(0))
              valid = uri.is_a?(URI::HTTPS) &&
                      uri.host == "download.java.net" &&
                      uri.userinfo.nil? &&
                      uri.query.nil? &&
                      uri.fragment.nil? &&
                      uri.path.start_with?("/java/early_access/valhalla/")
              abort "invalid Valhalla archive URL" unless valid
            ' "$1"
          }

          fetch_and_verify() {
            local key="$1"
            local platform="$2"
            local url="${base}/openjdk-${FULL_VERSION}_${platform}_bin.tar.gz"
            local checksum_text expected archive actual partial
            validate_url "${url}"
            checksum_text="$(curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --retry 3 \
              "${url}.sha256")"
            expected="${checksum_text%%[[:space:]]*}"
            [[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || {
              printf 'Invalid checksum for %s\n' "${platform}" >&2
              exit 1
            }

            archive="${cache_dir}/$(basename "${url}")"
            actual=""
            if [[ -f "${archive}" ]]; then
              actual="$(sha256sum "${archive}")"
              actual="${actual%%[[:space:]]*}"
            fi
            if [[ "${actual}" != "${expected}" ]]; then
              partial="${archive}.partial"
              rm -f -- "${partial}"
              curl --fail --silent --show-error --location \
                --proto '=https' --tlsv1.2 \
                --connect-timeout 15 --max-time 1800 --retry 3 \
                "${url}" --output "${partial}"
              actual="$(sha256sum "${partial}")"
              actual="${actual%%[[:space:]]*}"
              if [[ "${actual}" != "${expected}" ]]; then
                rm -f -- "${partial}"
                printf 'Checksum mismatch for %s\n' "${platform}" >&2
                exit 1
              fi
              mv -- "${partial}" "${archive}"
            fi
            [[ "${actual}" == "${expected}" ]] || {
              printf 'Checksum mismatch for %s\n' "${platform}" >&2
              exit 1
            }

            {
              printf 'url_%s=%s\n' "${key}" "${url}"
              printf 'sha_%s=%s\n' "${key}" "${expected}"
            } >>"${GITHUB_OUTPUT}"
          }

          fetch_and_verify mac_arm macos-aarch64
          fetch_and_verify mac_intel macos-x64
          fetch_and_verify linux_arm linux-aarch64
          fetch_and_verify linux_x64 linux-x64

      - name: Render formula and cask
        env:
          BUILD: ${{ steps.release.outputs.build }}
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
          JDK_VERSION: ${{ steps.release.outputs.jdk_version }}
          SHA_LINUX_ARM: ${{ steps.archives.outputs.sha_linux_arm }}
          SHA_LINUX_X64: ${{ steps.archives.outputs.sha_linux_x64 }}
          SHA_MAC_ARM: ${{ steps.archives.outputs.sha_mac_arm }}
          SHA_MAC_INTEL: ${{ steps.archives.outputs.sha_mac_intel }}
          URL_LINUX_ARM: ${{ steps.archives.outputs.url_linux_arm }}
          URL_LINUX_X64: ${{ steps.archives.outputs.url_linux_x64 }}
          URL_MAC_ARM: ${{ steps.archives.outputs.url_mac_arm }}
          URL_MAC_INTEL: ${{ steps.archives.outputs.url_mac_intel }}
        run: |
          set -Eeuo pipefail
          ruby <<'RUBY'
          require "fileutils"

          full_version = ENV.fetch("FULL_VERSION")
          jdk_version = ENV.fetch("JDK_VERSION")
          build = ENV.fetch("BUILD")
          platforms = {
            "macos-aarch64" => [ENV.fetch("URL_MAC_ARM"), ENV.fetch("SHA_MAC_ARM")],
            "macos-x64" => [ENV.fetch("URL_MAC_INTEL"), ENV.fetch("SHA_MAC_INTEL")],
            "linux-aarch64" => [ENV.fetch("URL_LINUX_ARM"), ENV.fetch("SHA_LINUX_ARM")],
            "linux-x64" => [ENV.fetch("URL_LINUX_X64"), ENV.fetch("SHA_LINUX_X64")],
          }

          template = Dir["Formula/jdkvalhalla@*.rb"].max_by do |path|
            match = File.basename(path).match(/\Ajdkvalhalla@(\d+)\.rb\z/)
            abort "invalid prebuilt formula template path: #{path}" unless match
            Integer(match[1], 10)
          end
          abort "no prebuilt formula template" unless template
          formula = File.read(template)
          replacements = {
            /^class \w+ < Formula$/ => "class JdkvalhallaAT#{jdk_version} < Formula",
            /Project Valhalla JDK \d+/ => "Project Valhalla JDK #{jdk_version}",
            /version "[^"]+"/ => "version \"#{full_version}\"",
            /"--release", "\d+"/ => "\"--release\", \"#{jdk_version}\"",
            %r{assert_match\(/\d+/,} => "assert_match(/#{jdk_version}/,",
          }
          replacements.each do |pattern, replacement|
            abort "formula template pattern missing: #{pattern}" unless formula.match?(pattern)
            formula = formula.sub(pattern, replacement)
          end
          platforms.each do |platform, (url, sha)|
            pattern = %r{url "https://download\.java\.net/java/early_access/valhalla/[^"]+_#{Regexp.escape(platform)}_bin\.tar\.gz"\n(\s+)sha256 "[0-9a-f]{64}"}
            replacement = "url \"#{url}\"\n\\1sha256 \"#{sha}\""
            abort "formula platform pattern missing: #{platform}" unless formula.match?(pattern)
            formula = formula.sub(pattern, replacement)
          end

          cask = File.read("Casks/jdkvalhalla.rb")
          cask_version_pattern = /version "[^"]+"/
          cask_checksum_pattern = /sha256 arm:\s+"[0-9a-f]{64}",\n\s*intel:\s+"[0-9a-f]{64}"/
          cask_url_pattern = %r{url "https://download\.java\.net/java/early_access/valhalla/\d+/\#\{version\.csv\.second\}/openjdk-\#\{version\.csv\.first\}_macos-\#\{arch\}_bin\.tar\.gz"}
          abort "cask version pattern missing" unless cask.match?(cask_version_pattern)
          abort "cask checksum pattern missing" unless cask.match?(cask_checksum_pattern)
          abort "cask URL pattern missing" unless cask.match?(cask_url_pattern)
          cask = cask.sub(cask_version_pattern, "version \"#{full_version},#{build}\"")
          cask = cask.sub(
            cask_checksum_pattern,
            "sha256 arm:   \"#{ENV.fetch("SHA_MAC_ARM")}\",\n" \
            "         intel: \"#{ENV.fetch("SHA_MAC_INTEL")}\"",
          )
          cask = cask.sub(
            cask_url_pattern,
            "url \"https://download.java.net/java/early_access/valhalla/#{jdk_version}/" \
            "\#{version.csv.second}/openjdk-\#{version.csv.first}_macos-\#{arch}_bin.tar.gz\"",
          )

          output_formula = "generated/Formula/jdkvalhalla@#{jdk_version}.rb"
          output_cask = "generated/Casks/jdkvalhalla.rb"
          FileUtils.mkdir_p(File.dirname(output_formula))
          FileUtils.mkdir_p(File.dirname(output_cask))
          File.write(output_formula, formula)
          File.write(output_cask, cask)
          RUBY

      - name: Validate generated packages
        env:
          JDK_VERSION: ${{ steps.release.outputs.jdk_version }}
        run: |
          set -Eeuo pipefail
          ruby -c "generated/Formula/jdkvalhalla@${JDK_VERSION}.rb"
          ruby -c generated/Casks/jdkvalhalla.rb

      - name: Resolve artifact metadata
        id: metadata
        env:
          FULL_VERSION: ${{ steps.release.outputs.full_version }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          artifact_name="prebuilt-${FULL_VERSION}-${GITHUB_SHA::12}"
          printf 'artifact_name=%s\n' "${artifact_name}" >>"${GITHUB_OUTPUT}"

      - name: Upload generated packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |-
            generated/Casks/jdkvalhalla.rb
            generated/Formula/jdkvalhalla@${{ steps.release.outputs.jdk_version }}.rb
          if-no-files-found: error
          retention-days: 1

  create-pr:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: generated

      - name: Validate exact generated paths
        env:
          JDK_VERSION: ${{ needs.prepare.outputs.jdk_version }}
        run: |
          set -Eeuo pipefail
          ruby -e '
            root = File.realpath("generated")
            expected = [
              File.join(root, "Casks", "jdkvalhalla.rb"),
              File.join(root, "Formula", "jdkvalhalla@#{ENV.fetch("JDK_VERSION")}.rb"),
            ].sort
            actual = Dir.glob(File.join(root, "**", "*"), File::FNM_DOTMATCH).select do |path|
              File.file?(path) || File.symlink?(path)
            end.sort
            abort "generated package allowlist mismatch" unless actual == expected
            abort "generated package must not be a symlink" if actual.any? { |path| File.symlink?(path) }
          '
          ruby -c "generated/Formula/jdkvalhalla@${JDK_VERSION}.rb"
          ruby -c generated/Casks/jdkvalhalla.rb
          cp "generated/Formula/jdkvalhalla@${JDK_VERSION}.rb" Formula/
          cp generated/Casks/jdkvalhalla.rb Casks/

      - name: Create update pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore: update Valhalla EA to ${{ needs.prepare.outputs.full_version }}"
          title: "chore: update Valhalla EA to ${{ needs.prepare.outputs.full_version }}"
          body: |
            Updates the official Project Valhalla early-access binaries to
            `${{ needs.prepare.outputs.full_version }}`.

            - JDK line: `${{ needs.prepare.outputs.jdk_version }}`
            - EA tag: `${{ needs.prepare.outputs.ea_tag }}`
            - Build: `${{ needs.prepare.outputs.build }}`

            The workflow parsed the official release page, constrained every
            archive URL to `download.java.net`, verified each published
            checksum against the downloaded archive, and transferred only the
            versioned formula and rolling cask into this job.
          branch: update/valhalla-${{ needs.prepare.outputs.full_version }}
          delete-branch: true
          add-paths: |-
            Casks/jdkvalhalla.rb
            Formula/jdkvalhalla@${{ needs.prepare.outputs.jdk_version }}.rb

      - name: Dispatch validation
        if: ${{ steps.create-pull-request.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_REF: ${{ steps.create-pull-request.outputs.pull-request-branch }}
        run: gh workflow run validate.yml --ref "${VALIDATION_REF}"
